[package]
name = "snag"
version = "0.1.0"
edition = "2021"
description = "Screen OCR tool for Linux — draw a selection, extract text to stdout"
license = "AGPL-3.0"
authors = ["gadonias"]

[[bin]]
name = "snag"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
thiserror = "1"
leptess = "0.14"
wayland-client = "0.31"
wayland-protocols-wlr = { version = "0.2", features = ["client"] }
wayland-protocols = { version = "0.31", features = ["client", "staging"] }
x11rb = { version = "0.13", features = ["cursor", "shm", "image", "allow-unsafe-code"] }
dbus = "0.9"

[dev-dependencies]
